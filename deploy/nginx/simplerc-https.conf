server {
    listen 9443 ssl;
    server_name 49.233.43.167;
    ssl_certificate /etc/letsencrypt/live/49.233.43.167/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/49.233.43.167/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ^~ /.well-known/acme-challenge/ { alias /opt/simplerc/shared/acme/.well-known/acme-challenge/; }
    location /simplerc-download/ { alias /opt/simplerc/public/; default_type application/vnd.android.package-archive; }
    location /simplerc/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }
    location / { return 404; }
}
